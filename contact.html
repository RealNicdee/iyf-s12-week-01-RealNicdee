<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicodemus Muriuki - About Me</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="logo-area">
            <img src="Images/Nicdee-pp.jpeg" alt="logo">
        </div>
        <div class="title-group">
            <h1 class="site-title">Nicodemus Muriuki</h1>
            <p class="tagline">I develop & amplify projects that put people first</p>
        </div>
    </header>

    <main>
        <section>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Me</a></li>
                    <div class="separator">
                        <li><a href="projects.html">Projects</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </div>
                </ul>
            </nav>
        </section>

        <section class="contact-info">
            <h2>Contact Me</h2>
            <p>Have a question or want to work together? Fill out the form below.</p>

            <form action="#" method="post" novalidate>
            
                <fieldset>
                    <legend>Your Details</legend>

                    <div>
                        <label for="fullname">Full Name *</label>
                        <input 
                            type="text" 
                            id="fullname" 
                            name="fullname" 
                            placeholder="e.g. Jane Doe" 
                            required
                        >
                    </div>

                    <div>
                        <label for="email">Email Address *</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="e.g. nicdee@example.com" required
                        >
                    </div>

                    <div>
                        <label for="phone">Phone Number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            placeholder="e.g. +254 700 000 000"
                        >
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Your Message</legend>

                    <div>
                        <label for="subject">Subject *</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Select a subject</option>
                            <option value="general">General Inquiry</option>
                            <option value="collaboration">Project Collaboration</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label for="message">Message *</label>
                        <textarea 
                            id="message" 
                            name="message" 
                            rows="6" 
                            placeholder="Write your message here (minimum 50 characters)..." 
                            minlength="50" 
                            required
                        ></textarea>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Preferences</legend>

                    <div>
                        <input 
                            type="checkbox" 
                            id="newsletter" 
                            name="newsletter" 
                            value="yes"
                        >
                        <label for="newsletter">Subscribe to my newsletter for updates</label>
                    </div>
                </fieldset>

                <button type="submit">Send Message</button>
            </form>
        </section>

  </main>

  <footer>
    <p>&copy; 2026 Nicodemus Muriuki. All rights reserved.</p>
  </footer>

</body>
</html>
